---
name: backend
discover: find . -type f -name 'test*.py' \( -path './tests/*' -o -path './testing/*' \)
run: pytest --disable-pytest-warnings --no-header --quiet --tb=short --override-ini=junit_family=legacy -m "not network" --junit-xml="<< outputs.junit >>" << test.atoms >>
options:
  store-test-results: true
